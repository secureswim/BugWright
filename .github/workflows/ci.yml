name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Runs on both platforms on purpose. BugWright is developed on Windows and
  # deployed on Linux, and it spawns processes, resolves paths and shells out
  # to git and docker - all places the two differ. An Ubuntu-only matrix let a
  # path-resolution test that hardcoded POSIX separators pass in CI and fail on
  # the machine it was written on.
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test

  # Formatting, linting and the web build are platform-independent, so they run
  # once rather than twice.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build -w @bugwright/web

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build runner images
        run: |
          docker build -t bugwright-runner-node:ci -f docker/runner.node.Dockerfile .
          docker build -t bugwright-runner-python:ci -f docker/runner.python.Dockerfile .

  reliability:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bugwright
          POSTGRES_PASSWORD: bugwright
          POSTGRES_DB: bugwright_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bugwright -d bugwright_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://bugwright:bugwright@localhost:5432/bugwright_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run db:generate
      - run: npm run db:push
      - run: npm run test:reliability
