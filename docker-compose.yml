services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bugwright
      POSTGRES_PASSWORD: bugwright
      POSTGRES_DB: bugwright
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugwright"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - bugwright_postgres:/var/lib/postgresql/data

volumes:
  bugwright_postgres:
