services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bugpilot
      POSTGRES_PASSWORD: bugpilot
      POSTGRES_DB: bugpilot
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bugpilot"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - bugpilot_postgres:/var/lib/postgresql/data

volumes:
  bugpilot_postgres:
